<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2563EB" />
  <title>小圈教育 · AI 工作台</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============ 手机外框（桌面端居中显示） ============ -->
  <div id="phone" class="phone">

    <!-- ============ 登录页 ============ -->
    <div id="loginPage" class="login-page">
      <div class="login-brand">
        <div class="login-logo">📚</div>
        <h1 class="login-name">小圈教育 · AI 工作台</h1>
        <p class="login-sub">教培机构数智化运营助手</p>
      </div>
      <div class="login-card">
        <div class="field">
          <label>手机号</label>
          <input id="loginPhone" type="tel" inputmode="numeric" placeholder="请输入手机号" value="13800000001" />
        </div>
        <div class="field">
          <label>密码</label>
          <input id="loginPwd" type="password" placeholder="请输入密码" value="123456" />
        </div>
        <button id="loginBtn" class="btn-primary btn-block">登 录</button>
        <p class="login-tip">演示账号：13800000001 / 123456（首次进入自动载入演示数据）</p>
        <button id="loginReset" class="link-btn">清空本地数据并重新载入演示</button>
      </div>
    </div>

    <!-- ============ 应用主体 ============ -->
    <div id="appShell" class="app-shell hidden">
      <!-- 顶部栏 -->
      <header class="topbar">
        <div class="topbar-left">
          <span id="topbarTitle" class="topbar-title">工作台</span>
          <span id="topbarOrg" class="topbar-org">小圈教育</span>
        </div>
        <div class="topbar-actions">
          <button id="topAddBtn" class="icon-btn" title="快捷新增">＋</button>
          <button id="topBellBtn" class="icon-btn" title="提醒">🔔<span id="bellDot" class="bell-dot hidden"></span></button>
        </div>
      </header>

      <!-- 主内容容器 -->
      <main id="pageHost" class="page-host"></main>

      <!-- 底部 TabBar -->
      <nav class="tabbar">
        <button class="tab active" data-tab="dashboard"><span class="tab-ico">🏠</span><span class="tab-tx">工作台</span></button>
        <button class="tab" data-tab="students"><span class="tab-ico">👩‍🎓</span><span class="tab-tx">学员</span></button>
        <button class="tab" data-tab="renewal"><span class="tab-ico">💰</span><span class="tab-tx">续费</span></button>
        <button class="tab" data-tab="study"><span class="tab-ico">📈</span><span class="tab-tx">学情</span></button>
        <button class="tab" data-tab="mine"><span class="tab-ico">👤</span><span class="tab-tx">我的</span></button>
      </nav>
    </div>

    <!-- ============ 通用底部抽屉/模态 ============ -->
    <div id="sheetMask" class="sheet-mask hidden">
      <div id="sheet" class="sheet">
        <div class="sheet-head">
          <span id="sheetTitle" class="sheet-title">标题</span>
          <button id="sheetClose" class="sheet-close">✕</button>
        </div>
        <div id="sheetBody" class="sheet-body"></div>
        <div id="sheetFoot" class="sheet-foot"></div>
      </div>
    </div>

    <!-- ============ 全屏子页 ============ -->
    <div id="subPage" class="subpage hidden">
      <header class="sub-head">
        <button id="subBack" class="sub-back">‹ 返回</button>
        <span id="subTitle" class="sub-title">详情</span>
        <span class="sub-ph"></span>
      </header>
      <div id="subBody" class="sub-body"></div>
    </div>

    <!-- ============ Toast ============ -->
    <div id="toast" class="toast hidden"></div>
    <!-- ============ 加载遮罩 ============ -->
    <div id="loading" class="loading hidden"><div class="spinner"></div><span id="loadingTx">处理中…</span></div>
  </div>

  <script src="vendor/echarts.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
